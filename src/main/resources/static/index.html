<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HopIn · Share the ride, split the fare</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('hopinTheme'); } catch (e) { }
    if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg:#f3f6fb; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --brand:#2563eb; --brand-dark:#1d4ed8; --teal:#14b8a6; --amber:#fbbf24;
    --ok:#16a34a; --bad:#dc2626; --warn:#d97706;
    --shadow:0 8px 28px rgba(15,23,42,.07);
    --header-bg:rgba(255,255,255,.9); --hover:#eef2ff; --input-bg:#ffffff; --soft:#f1f5f9; --soft2:#f8fafc;
    --ghost:#eef2f7; --ghost-hover:#e2e8f0; --map-bg:#e8eef5; --mapinfo:rgba(255,255,255,.96); --err-bg:#fef2f2;
    --chip-bg:#e0e7ff; --chip-fg:#3730a3; --green-bg:#dcfce7; --green-fg:#166534; --red-bg:#fee2e2; --red-fg:#991b1b;
    --amber-bg:#fef3c7; --amber-fg:#92400e; --teal-bg:#ccfbf1; --teal-fg:#115e59; --gray-bg:#e2e8f0; --gray-fg:#334155;
    --bargain-bg:linear-gradient(135deg,#fffbeb,#fef3c7); --note-bg:#f0fdfa; --note-line:#99f6e4;
    --stat-bg:linear-gradient(135deg,#eff6ff,#ecfeff); --banner-bg:#fff7ed; --banner-line:#fed7aa; --banner-fg:#9a3412;
    --star-off:#cbd5e1; --toast-bg:#0f172a; --toast-fg:#ffffff;
    --land-bg:linear-gradient(160deg,#2dd4bf 0%,#14b8a6 35%,#0d9488 70%,#0f766e 100%);
    color-scheme:light;
  }
  :root[data-theme="dark"] {
    --bg:#0b1220; --card:#111a2b; --ink:#e5e7eb; --muted:#94a3b8; --line:#23304a;
    --brand:#3b82f6; --brand-dark:#2563eb;
    --shadow:0 8px 28px rgba(0,0,0,.35);
    --header-bg:rgba(11,18,32,.88); --hover:#1c2740; --input-bg:#0b1324; --soft:#18233a; --soft2:#0f1828;
    --ghost:#1c2740; --ghost-hover:#26344f; --map-bg:#0b1220; --mapinfo:rgba(17,26,43,.95); --err-bg:#3a1218;
    --chip-bg:#1e1b4b; --chip-fg:#c7d2fe; --green-bg:#0c2e1c; --green-fg:#86efac; --red-bg:#3b1116; --red-fg:#fca5a5;
    --amber-bg:#3a2706; --amber-fg:#fcd34d; --teal-bg:#08302d; --teal-fg:#5eead4; --gray-bg:#1e293b; --gray-fg:#cbd5e1;
    --bargain-bg:linear-gradient(135deg,#241a06,#33250a); --note-bg:#08302d; --note-line:#115e59;
    --stat-bg:linear-gradient(135deg,#10203a,#0b2a2e); --banner-bg:#2b1709; --banner-line:#7c2d12; --banner-fg:#fdba74;
    --star-off:#475569; --toast-bg:#e5e7eb; --toast-fg:#0f172a;
    --land-bg:linear-gradient(160deg,#115e59 0%,#0f766e 35%,#134e4a 70%,#042f2e 100%);
    color-scheme:dark;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { font-family:Inter, system-ui, "Segoe UI", Roboto, sans-serif; background:
    radial-gradient(900px 400px at 100% -10%, rgba(20,184,166,.12), transparent 60%),
    radial-gradient(800px 380px at -10% 0%, rgba(37,99,235,.10), transparent 60%), var(--bg);
    color:var(--ink); min-height:100vh; }
  a { color:var(--brand); font-weight:600; text-decoration:none; }
  a:hover { text-decoration:underline; }

  header { position:sticky; top:0; z-index:1100; background:var(--header-bg); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .bar { max-width:1200px; margin:0 auto; padding:10px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:22px; letter-spacing:-.4px; }
  .brand img { width:40px; height:40px; border-radius:11px; box-shadow:0 4px 12px rgba(20,184,166,.35); }
  .brand span b { color:var(--teal); }
  nav { display:flex; gap:6px; flex-wrap:wrap; flex:1; }
  .pill { position:relative; background:transparent; color:var(--muted); border:0; padding:8px 14px; border-radius:99px; cursor:pointer; font:inherit; font-weight:600; }
  .pill:hover { background:var(--hover); color:var(--brand); }
  .pill.on { background:var(--brand); color:#fff; }
  .badge { position:absolute; top:-4px; right:-6px; min-width:20px; height:20px; padding:0 6px; border-radius:99px; background:var(--bad); color:#fff; font-size:11px; font-weight:800; display:grid; place-items:center; border:2px solid var(--card); animation:pop .3s ease; }
  @keyframes pop { from { transform:scale(.4); } to { transform:scale(1); } }
  .me { display:flex; align-items:center; gap:10px; font-size:14px; }
  .avatar { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--teal),var(--brand)); color:#fff; display:grid; place-items:center; font-weight:700; flex:none; }
  .avatar.lg { width:64px; height:64px; font-size:26px; }

  main { max-width:1200px; margin:0 auto; padding:22px 18px 60px; }
  h2 { margin:0 0 4px; font-size:20px; letter-spacing:-.2px; }
  h3 { margin:0 0 10px; font-size:16px; }
  h3.sec { margin:22px 0 10px; }
  .sub { color:var(--muted); margin:0 0 16px; font-size:14px; }

  .card { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:16px; box-shadow:var(--shadow); }
  .card.narrow { max-width:640px; }
  .split { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:18px; align-items:start; }
  .mapbox { position:sticky; top:78px; height:calc(100vh - 104px); min-height:380px; border-radius:16px; overflow:hidden; border:1px solid var(--line); box-shadow:var(--shadow); background:var(--map-bg); }
  .mapnote { height:100%; display:grid; place-items:center; text-align:center; padding:24px; color:var(--muted); font-size:14px; }
  .mapinfo { position:absolute; left:12px; bottom:28px; z-index:1000; background:var(--mapinfo); color:var(--ink); padding:8px 12px; border-radius:10px; font-size:13px; font-weight:700; box-shadow:var(--shadow); }
  @media (max-width:900px) { .split { grid-template-columns:1fr; } .mapbox { position:relative; top:0; height:340px; min-height:300px; order:-1; } }

  label { display:block; font-size:12px; font-weight:700; color:var(--muted); margin:0 0 4px; text-transform:uppercase; letter-spacing:.4px; }
  input, select, textarea { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--input-bg); color:var(--ink); margin-bottom:12px; }
  textarea { resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:2px solid rgba(37,99,235,.35); border-color:var(--brand); }
  input.err { border-color:var(--bad); background:var(--err-bg); }
  input[type=checkbox] { width:auto; margin:0 8px 0 0; }
  .check { display:flex; align-items:center; margin-bottom:10px; font-weight:600; font-size:14px; text-transform:none; letter-spacing:0; color:var(--ink); }
  .prefs { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:0 12px; margin-bottom:6px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:0 12px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0; }

  .psearch { margin-bottom:12px; }
  .prow { display:flex; gap:6px; } .prow input { margin-bottom:0; flex:1; }
  .plist { border:1px solid var(--line); border-radius:10px; margin-top:6px; background:var(--card); max-height:220px; overflow:auto; box-shadow:var(--shadow); }
  .popt { padding:9px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--line); }
  .popt:last-child { border-bottom:0; } .popt:hover { background:var(--hover); } .popt.none { color:var(--muted); cursor:default; }

  .mpin { width:30px; height:30px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); display:grid; place-items:center; border:2px solid #fff; box-shadow:0 3px 8px rgba(0,0,0,.35); }
  .mpin span { transform:rotate(45deg); color:#fff; font-weight:800; font-size:13px; }
  .mnum { width:24px; height:24px; border-radius:50%; background:#1d4ed8; color:#fff; font-weight:800; font-size:12px; display:grid; place-items:center; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.35); }
  .mdot { width:14px; height:14px; border-radius:50%; background:#fff; border:4px solid #64748b; box-shadow:0 1px 4px rgba(0,0,0,.4); }

  button { font:inherit; font-weight:700; border:0; border-radius:10px; padding:9px 14px; cursor:pointer; background:var(--brand); color:#fff; transition:transform .05s, background .15s; }
  button:hover { background:var(--brand-dark); }
  button:active { transform:translateY(1px); }
  button:disabled { opacity:.6; cursor:wait; }
  button.ok { background:var(--ok); } button.bad { background:var(--bad); } button.warn { background:var(--warn); }
  button.ghost { background:var(--ghost); color:var(--ink); } button.ghost:hover { background:var(--ghost-hover); }
  button.sm { padding:6px 10px; font-size:13px; border-radius:8px; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }

  .item { border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; background:var(--card); transition:box-shadow .15s, border-color .15s; }
  .item.sel { border-color:var(--brand); box-shadow:0 0 0 3px rgba(37,99,235,.15); }
  .item .head { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .route { font-weight:800; font-size:16px; }
  .muted { color:var(--muted); font-size:13px; }
  .chip { display:inline-block; font-size:12px; font-weight:700; padding:3px 10px; border-radius:99px; background:var(--chip-bg); color:var(--chip-fg); margin:0 4px 4px 0; }
  .chip.green { background:var(--green-bg); color:var(--green-fg); } .chip.red { background:var(--red-bg); color:var(--red-fg); }
  .chip.amber { background:var(--amber-bg); color:var(--amber-fg); } .chip.teal { background:var(--teal-bg); color:var(--teal-fg); } .chip.gray { background:var(--gray-bg); color:var(--gray-fg); }
  .chips { margin:8px 0; }
  .stars { color:#f59e0b; letter-spacing:1px; }
  .price { font-size:22px; font-weight:800; }
  .price small { font-size:12px; color:var(--muted); font-weight:600; }
  .ft { display:inline-block; margin-right:14px; font-size:13px; }
  .ft b { color:var(--muted); font-weight:700; margin-right:4px; }
  .bargain { background:var(--bargain-bg); border:1px dashed #f59e0b; border-radius:12px; padding:10px 12px; margin:10px 0; font-size:13px; }
  .timeline { margin:10px 0; padding-left:4px; }
  .tl { display:flex; gap:10px; align-items:center; font-size:13px; padding:3px 0; }
  .tl .dot { width:12px; height:12px; border-radius:50%; background:#94a3b8; flex:none; border:2px solid var(--card); box-shadow:0 0 0 2px var(--line); }
  .tl.start .dot { background:var(--ok); box-shadow:0 0 0 2px #bbf7d0; } .tl.end .dot { background:var(--bad); box-shadow:0 0 0 2px #fecaca; }
  .tl.in .dot { background:var(--brand); box-shadow:0 0 0 2px #bfdbfe; }
  .tl.dim { opacity:.45; }
  .stopchips { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .stopchip { display:flex; align-items:center; gap:8px; background:var(--soft); border-radius:10px; padding:6px 10px; font-size:13px; }
  .stopchip .n { background:var(--brand); color:#fff; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:12px; flex:none; }
  .stopchip .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .legs { font-size:13px; color:var(--muted); margin:-4px 0 12px; }
  .extras details { border-top:1px solid var(--line); padding:8px 0 2px; }
  .extras summary { cursor:pointer; font-weight:700; font-size:13px; color:var(--brand); }
  .rev { padding:8px 0; border-bottom:1px dashed var(--line); font-size:13px; }
  .rev:last-child { border-bottom:0; }
  .pax { margin:10px 0; padding:10px 12px; background:var(--soft2); border-radius:12px; }
  .paxrow { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 0; flex-wrap:wrap; }
  .note { background:var(--note-bg); border:1px solid var(--note-line); border-radius:12px; padding:10px 12px; font-size:14px; margin:10px 0; }
  .empty { text-align:center; padding:28px 18px; }
  .empty b { font-size:17px; }

  .stat { text-align:center; padding:14px; border-radius:14px; background:var(--stat-bg); border:1px solid var(--line); }
  .stat span { color:var(--muted); font-size:12px; font-weight:700; }
  .stat b { display:block; font-size:26px; }

  .starpick { display:flex; gap:6px; margin:6px 0 16px; }
  .starpick .sp { background:transparent; color:var(--star-off); font-size:38px; padding:0 2px; line-height:1; }
  .starpick .sp.on { color:#f59e0b; }
  .starpick .sp:hover { background:transparent; }

  body.landing { background:var(--land-bg); }
  body.landing header { display:none; }
  .land { min-height:calc(100vh - 90px); display:grid; grid-template-columns:1.1fr .9fr; gap:44px; align-items:center; max-width:1050px; margin:0 auto; color:#fff; }
  .intro-logo { width:130px; height:130px; border-radius:32px; box-shadow:0 18px 40px rgba(0,0,0,.25), 0 0 0 6px rgba(255,255,255,.18); animation:dropIn 1.2s cubic-bezier(.2,.8,.2,1) both; }
  .intro-name { font-size:64px; line-height:1; margin:22px 0 0; letter-spacing:-2px; animation:dropIn 1.8s cubic-bezier(.2,.8,.2,1) .6s both; }
  .intro-name span { color:#fde68a; }
  .intro-welcome { font-size:30px; font-weight:800; margin:14px 0 4px; animation:fadeIn 1.2s ease 2.2s both; }
  .intro-tag { font-size:17px; opacity:.92; margin:0 0 10px; animation:fadeIn 1s ease 2.6s both; }
  .intro-list { padding:0; list-style:none; display:grid; gap:8px; animation:fadeIn 1s ease 2.9s both; }
  .intro-list li::before { content:"✔"; margin-right:8px; font-weight:800; color:#fde68a; }
  .auth-card { animation:fadeUp .9s ease 1.4s both; }
  @keyframes dropIn { from { opacity:0; transform:translateY(-90px); } to { opacity:1; transform:none; } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .intro-logo, .intro-name, .intro-welcome, .intro-tag, .intro-list, .auth-card { animation:none; } }
  @media (max-width:820px) { .land { grid-template-columns:1fr; text-align:center; gap:20px; } .intro-name { font-size:46px; } .intro-list { justify-items:center; } }

  #toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--toast-bg); color:var(--toast-fg); padding:11px 18px; border-radius:12px; display:none; max-width:90%; z-index:3000; font-weight:600; box-shadow:var(--shadow); }
  #toast.err { background:var(--bad); }
  .modal { position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:2000; display:grid; place-items:center; padding:16px; }
  .modal .box { background:var(--card); color:var(--ink); border-radius:18px; width:min(780px,100%); padding:18px; max-height:92vh; overflow:auto; position:relative; }
  .modal .box.small { width:min(460px,100%); }
  .modal .close { position:absolute; top:12px; right:12px; }
  .modal .mapbox { position:relative; top:0; height:420px; }
  .prof-head { display:flex; gap:14px; align-items:center; margin-right:60px; }
  .banner { background:var(--banner-bg); border:1px solid var(--banner-line); color:var(--banner-fg); padding:10px 14px; border-radius:12px; font-size:13px; margin-bottom:14px; }
  .theme-btn { background:var(--ghost); color:var(--ink); padding:7px 10px; border-radius:99px; font-size:13px; }
  .theme-btn:hover { background:var(--ghost-hover); }
  .theme-fab { position:fixed; top:16px; right:16px; z-index:1200; background:rgba(255,255,255,.18); color:#fff; border:1px solid rgba(255,255,255,.35); border-radius:99px; padding:8px 14px; font-size:13px; backdrop-filter:blur(6px); }
  .theme-fab:hover { background:rgba(255,255,255,.28); }
  [data-theme="dark"] .leaflet-control-layers, [data-theme="dark"] .leaflet-bar a, [data-theme="dark"] .leaflet-control-attribution, [data-theme="dark"] .leaflet-tooltip { background:#111a2b; color:#e5e7eb; border-color:#23304a; }
  [data-theme="dark"] .leaflet-control-attribution a { color:#93c5fd; }
  [data-theme="dark"] .leaflet-control-scale-line { background:rgba(17,26,43,.8); color:#e5e7eb; border-color:#94a3b8; }
  img.avatar { object-fit:cover; background:var(--soft); display:block; }
  .avatar.xl { width:88px; height:88px; font-size:34px; }
  .vt { display:inline-grid; place-items:center; width:16px; height:16px; border-radius:50%; background:var(--ok); color:#fff; font-size:10px; font-weight:800; vertical-align:middle; }
  .bell { position:relative; background:var(--ghost); color:var(--ink); padding:7px 10px; border-radius:99px; font-size:15px; line-height:1; }
  .bell:hover { background:var(--ghost-hover); }
  .badge.static { position:static; border:0; flex:none; }
  .who { display:flex; gap:10px; align-items:flex-start; }
  .summary { background:var(--soft); border-radius:12px; padding:10px 12px; font-size:13px; margin:10px 0; line-height:1.5; }
  .price-hint { font-size:13px; font-weight:600; border-radius:10px; padding:8px 12px; margin:-4px 0 12px; }
  .price-hint.green { background:var(--green-bg); color:var(--green-fg); }
  .price-hint.amber { background:var(--amber-bg); color:var(--amber-fg); }
  .price-hint.red { background:var(--red-bg); color:var(--red-fg); }
  .meet { background:var(--soft2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:0 0 12px; font-size:13px; }
  .meet p { margin:2px 0 8px; }
  .meet-row { display:flex; gap:10px; align-items:flex-start; padding:6px 0; border-top:1px dashed var(--line); }
  .sm-pin { width:22px; height:22px; font-size:11px; flex:none; }
  .spot { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:3px 0; }
  .geo-note { font-size:12px; color:var(--teal-fg); margin-top:4px; min-height:0; }
  .photo-row { display:flex; gap:16px; align-items:center; margin-bottom:14px; }
  .vrow { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  .vform { padding:0 0 12px; }
  .chat-wrap { display:grid; grid-template-columns:340px minmax(0,1fr); gap:18px; align-items:start; }
  .chat-list { max-height:calc(100vh - 120px); overflow:auto; }
  .conv { display:flex; gap:10px; align-items:center; padding:10px; border-radius:12px; cursor:pointer; }
  .conv:hover { background:var(--hover); }
  .conv.sel { background:var(--hover); box-shadow:inset 0 0 0 1px var(--brand); }
  .conv-main { flex:1; min-width:0; }
  .conv-top { display:flex; justify-content:space-between; gap:8px; }
  .conv-route, .conv-last { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:13px; }
  .chat-pane { display:flex; flex-direction:column; height:calc(100vh - 120px); min-height:420px; padding:0; overflow:hidden; }
  .chat-head { display:flex; gap:10px; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line); }
  .msgs { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .bubble { max-width:75%; padding:8px 12px; border-radius:14px; font-size:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .bubble span { display:block; font-size:11px; opacity:.75; margin-top:2px; text-align:right; }
  .bubble.mine { align-self:flex-end; background:var(--brand); color:#fff; border-bottom-right-radius:4px; }
  .bubble.theirs { align-self:flex-start; background:var(--soft); color:var(--ink); border-bottom-left-radius:4px; }
  .composer { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); align-items:flex-end; }
  .composer textarea { margin:0; resize:none; }
  .chat-pane .banner { margin:10px; }
  .chat-pane .mapnote { flex:1; height:auto; }
  @media (max-width:900px) { .chat-wrap { grid-template-columns:1fr; } .chat-list { max-height:none; } .chat-pane { height:70vh; } }
  .notif { padding:10px 12px; border-radius:10px; border:1px solid var(--line); margin-bottom:8px; cursor:pointer; font-size:14px; display:flex; flex-direction:column; gap:2px; }
  .notif.unread { border-color:var(--brand); background:var(--hover); }
  .notif:hover { background:var(--hover); }
  .sos-box { border:1px solid var(--red-bg); background:linear-gradient(135deg, var(--red-bg), transparent 80%); border-radius:14px; padding:12px 14px; }
  a.btn { display:inline-block; font-weight:700; border-radius:10px; padding:9px 14px; background:var(--brand); color:#fff; text-decoration:none; }
  a.btn:hover { text-decoration:none; filter:brightness(1.07); }
  a.btn.bad { background:var(--bad); }
  a.btn.ghost { background:var(--ghost); color:var(--ink); }
  a.btn.sm { padding:6px 10px; font-size:13px; border-radius:8px; }
  .live-chip { position:fixed; left:16px; bottom:16px; z-index:1500; background:var(--card); color:var(--ink); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:99px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer; display:flex; gap:8px; align-items:center; }
  .dotlive { width:10px; height:10px; border-radius:50%; background:var(--ok); animation:pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(22,163,74,.6); } 70% { box-shadow:0 0 0 10px rgba(22,163,74,0); } 100% { box-shadow:0 0 0 0 rgba(22,163,74,0); } }
  .sos-item { border-color:var(--bad); box-shadow:0 0 0 2px var(--red-bg); }
  .sos-stat { background:var(--red-bg); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header><div class="bar" id="bar"></div></header>
<main id="app"></main>
<div id="toast"></div>
<div id="modalRoot"></div>
<div id="liveChip" class="live-chip hidden"></div>

<script>
let token = localStorage.getItem('token');
let me = JSON.parse(localStorage.getItem('me') || 'null');
let tab = null;
let registering = false;
let mapsOk = false;
let curMap = null;
let lastResults = [];
let draft = { from: null, to: null, stops: [] };
let roadKm = null;
let myGiven = [];
let badgeCount = 0;
let badgeTimer = null;
const rideCache = {};
const nameCache = {};
const liveMaps = [];
let msgCount = 0;
let notifCount = 0;
let chatTimer = null;
let chatOpen = null;
let geoFrom = null;
let geoTo = null;
let pendingSearch = null;
const shares = {};
const PREFS = [['noSmoking', 'No smoking'], ['noPets', 'No pets'], ['ac', 'AC available'], ['music', 'Music on'], ['luggage', 'Luggage space']];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (d) => new Date(d).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
const inr = (v) => '₹' + (Math.round(Number(v) * 100) / 100).toLocaleString('en-IN');
const starIcons = (n) => `<span class="stars">${'★'.repeat(n)}${'☆'.repeat(5 - n)}</span>`;
const starLine = (u) => u.ratingCount ? `<span class="stars">★</span> ${u.rating} (${u.ratingCount})` : 'New';
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const roundTen = (v) => Math.max(10, Math.round((+v || 0) / 10) * 10);

function nameLink(u) {
  nameCache[u.id] = u.name;
  return `<a href="#" onclick="openProfile(${u.id});return false">${esc(u.name)}</a>${u.verified ? ' <span class="vt" title="Verified email, phone and ID">✔</span>' : ''}`;
}

function avatar(u, cls = '') {
  if (u && u.hasPhoto) return `<img class="avatar ${cls}" src="/api/public/photos/${u.id}?v=${u.photoVersion || 0}" alt="">`;
  return `<div class="avatar ${cls}">${esc(((u && u.name) || '?').charAt(0).toUpperCase())}</div>`;
}

function badgeSpan(id, n) {
  return `<span id="${id}" class="badge ${n ? '' : 'hidden'}">${n > 9 ? '9+' : n}</span>`;
}

function toast(msg, err) {
  const t = $('toast');
  t.textContent = msg;
  t.className = err ? 'err' : '';
  t.style.display = 'block';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.style.display = 'none', 3200);
}

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 401 && token) logout();
    throw new Error(data.message || 'Something went wrong');
  }
  return data;
}

async function run(fn) {
  try { await fn(); } catch (e) { toast(e.message, true); }
}

function logout() {
  Object.keys(shares).forEach(id => stopWatch(id));
  Object.keys(shares).forEach(id => delete shares[id]);
  clearInterval(chatTimer); chatTimer = null; chatOpen = null;
  token = null; me = null; tab = null; badgeCount = 0; msgCount = 0; notifCount = 0;
  clearInterval(badgeTimer); badgeTimer = null;
  render.resumed = false;
  localStorage.removeItem('token'); localStorage.removeItem('me');
  closeModal();
  updateLiveChip();
  render();
}

function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }

function streetsUrl() {
  return 'https://{s}.basemaps.cartocdn.com/rastertiles/' + (isDark() ? 'dark_all' : 'voyager') + '/{z}/{x}/{y}{r}.png';
}

function themeLabel() { return isDark() ? '☀️ Light' : '🌙 Dark'; }

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  for (let i = liveMaps.length - 1; i >= 0; i--) {
    const m = liveMaps[i];
    if (!m.getContainer().isConnected) { liveMaps.splice(i, 1); continue; }
    m._streets.setUrl(streetsUrl());
  }
  document.querySelectorAll('.theme-btn, .theme-fab').forEach(b => { b.textContent = themeLabel(); });
}

function toggleTheme() {
  const t = isDark() ? 'light' : 'dark';
  try { localStorage.setItem('hopinTheme', t); } catch (e) { }
  applyTheme(t);
}

if (window.matchMedia) {
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
    let saved = null;
    try { saved = localStorage.getItem('hopinTheme'); } catch (x) { }
    if (!saved) applyTheme(e.matches ? 'dark' : 'light');
  });
}

function baseLayers() {
  const streets = L.tileLayer(streetsUrl(), {
    subdomains: 'abcd', maxZoom: 20, attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
  });
  const satellite = L.layerGroup([
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19, attribution: 'Imagery &copy; Esri'
    }),
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd', maxZoom: 20
    })
  ]);
  const classic = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
  });
  return { 'Streets': streets, 'Satellite': satellite, 'Classic': classic };
}

function loadMaps() {
  mapsOk = typeof L !== 'undefined';
  return Promise.resolve(mapsOk);
}

function newMap(elId) {
  const el = $(elId);
  if (!el) return null;
  if (typeof L === 'undefined') {
    el.innerHTML = '<div class="mapnote"><div><b>Map could not load</b><br>Check your internet connection and refresh the page.</div></div>';
    return null;
  }
  const m = L.map(el, { zoomControl: true }).setView([22.5, 79], 5);
  const layers = baseLayers();
  let pick = 'Streets';
  try { pick = localStorage.getItem('hopinMap') || 'Streets'; } catch (e) { }
  (layers[pick] || layers.Streets).addTo(m);
  L.control.layers(layers, null, { position: 'topright' }).addTo(m);
  L.control.scale({ imperial: false }).addTo(m);
  m.on('baselayerchange', (e) => { try { localStorage.setItem('hopinMap', e.name); } catch (x) { } });
  m._streets = layers.Streets;
  m._over = [];
  m._seq = 0;
  liveMaps.push(m);
  setTimeout(() => m.invalidateSize(), 150);
  return m;
}

function add(m, layer) {
  layer.addTo(m);
  m._over.push(layer);
  return layer;
}

function clearMap(m) {
  m._over.forEach(o => m.removeLayer(o));
  m._over = [];
}

function setInfo(elId, text) {
  const host = $(elId);
  if (!host) return;
  let d = host.querySelector('.mapinfo');
  if (!text) { if (d) d.remove(); return; }
  if (!d) { d = document.createElement('div'); d.className = 'mapinfo'; host.appendChild(d); }
  d.textContent = text;
}

function pinIcon(kind, label) {
  if (kind === 'mid') return L.divIcon({ className: '', html: '<div class="mdot"></div>', iconSize: [14, 14], iconAnchor: [7, 7] });
  if (kind === 'stop') return L.divIcon({ className: '', html: `<div class="mnum">${label}</div>`, iconSize: [24, 24], iconAnchor: [12, 12] });
  const color = kind === 'start' ? '#16a34a' : '#dc2626';
  return L.divIcon({ className: '', html: `<div class="mpin" style="background:${color}"><span>${label}</span></div>`, iconSize: [30, 30], iconAnchor: [15, 36], tooltipAnchor: [0, -30] });
}

async function osrm(points) {
  const coords = points.map(p => p.lng + ',' + p.lat).join(';');
  const r = await fetch('https://router.project-osrm.org/route/v1/driving/' + coords + '?overview=full&geometries=geojson');
  const d = await r.json();
  if (d.code !== 'Ok' || !d.routes || !d.routes.length) return null;
  const rt = d.routes[0];
  return { line: rt.geometry.coordinates.map(c => [c[1], c[0]]), km: rt.distance / 1000, min: rt.duration / 60 };
}

function roadLine(m, line, faint) {
  add(m, L.polyline(line, { color: faint ? '#94a3b8' : '#1d4ed8', weight: faint ? 7 : 9, opacity: faint ? 0.45 : 0.9, lineCap: 'round', lineJoin: 'round', interactive: false }));
  add(m, L.polyline(line, { color: faint ? '#e2e8f0' : '#4f8ef7', weight: faint ? 4 : 5, opacity: 1, lineCap: 'round', lineJoin: 'round', interactive: false }));
}

function drawRoute(m, pts, opt = {}) {
  if (!m) return;
  clearMap(m);
  const seq = ++m._seq;
  let list = pts.map((p, i) => ({ ...p, i }));
  if (opt.segment) list = list.filter(p => p.i >= opt.segment.from && p.i <= opt.segment.to);
  const ok = list.filter(p => p.lat != null && p.lng != null);
  if (!ok.length) return;
  const first = list[0].i, last = list[list.length - 1].i;
  const hi = opt.hi;
  ok.forEach(p => {
    let kind, label = '';
    if (hi) {
      kind = p.i === hi.from ? 'start' : p.i === hi.to ? 'end' : 'mid';
      label = p.i === hi.from ? 'A' : p.i === hi.to ? 'B' : '';
    } else if (p.i === first) { kind = 'start'; label = 'A'; }
    else if (p.i === last) { kind = 'end'; label = 'B'; }
    else if (opt.segment) { kind = 'mid'; }
    else { kind = 'stop'; label = String(p.i); }
    add(m, L.marker([p.lat, p.lng], { icon: pinIcon(kind, label), zIndexOffset: kind === 'mid' ? 0 : 500 }).bindTooltip(esc(p.name)));
  });
  if (ok.length === 1) { m.setView([ok[0].lat, ok[0].lng], 13, { animate: false }); return; }
  const straight = ok.map(p => [p.lat, p.lng]);
  m.invalidateSize();
  m.fitBounds(straight, { padding: [60, 60], animate: false });
  const dashed = add(m, L.polyline(straight, { color: '#64748b', weight: 3, dashArray: '6 8', opacity: 0.7 }));
  const segPts = hi ? ok.filter(p => p.i >= hi.from && p.i <= hi.to) : null;
  Promise.all([osrm(ok), segPts && segPts.length > 1 ? osrm(segPts) : null])
    .then(([full, seg]) => {
      if (seq !== m._seq) return;
      if (!full) { if (opt.onInfo) opt.onInfo(null, null); return; }
      m.removeLayer(dashed);
      m._over = m._over.filter(x => x !== dashed);
      if (seg) {
        roadLine(m, full.line, true);
        roadLine(m, seg.line, false);
      } else {
        roadLine(m, full.line, false);
      }
      m.invalidateSize();
      m.fitBounds(L.latLngBounds(full.line), { padding: [50, 50], animate: false });
      const use = seg || full;
      if (opt.onInfo) opt.onInfo(use.km, use.min);
    })
    .catch(() => { if (seq === m._seq && opt.onInfo) opt.onInfo(null, null); });
}

function haversine(a, b) {
  const R = 6371, rad = (x) => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

function legWeights(pts) {
  const legs = pts.length - 1;
  const eq = Array(legs).fill(1 / legs);
  if (!pts.every(p => p.lat != null && p.lng != null)) return eq;
  const d = [];
  let total = 0;
  for (let i = 0; i < legs; i++) { d.push(haversine(pts[i], pts[i + 1])); total += d[i]; }
  return total > 0 ? d.map(x => x / total) : eq;
}

function legUnits(pts, units) {
  const legs = pts.length - 1, w = legWeights(pts);
  const base = units >= legs ? 1 : 0, rest = units - base * legs;
  const out = [], rem = [];
  let used = 0;
  for (let i = 0; i < legs; i++) {
    const ex = rest * w[i], fl = Math.floor(ex);
    out.push(base + fl); rem.push(ex - fl); used += fl;
  }
  const order = rem.map((r, i) => i).sort((a, b) => rem[b] - rem[a] || a - b);
  const left = Math.max(0, rest - used);
  for (let k = 0; k < left && k < legs; k++) out[order[k]]++;
  return out;
}

function segPrice(base, pts, from, to) {
  const u = legUnits(pts, Math.round(base / 10));
  let s = 0;
  for (let i = from; i < to; i++) s += u[i];
  return Math.max(10, s * 10);
}

function ridePoints(r) {
  const stops = (r.stops || []).slice().sort((a, b) => a.seq - b.seq);
  return [
    { name: r.source, lat: r.srcLat, lng: r.srcLng },
    ...stops.map(s => ({ name: s.name, lat: s.lat, lng: s.lng })),
    { name: r.destination, lat: r.dstLat, lng: r.dstLng }
  ];
}

function shortName(d) {
  const a = d.address || {};
  const city = a.city || a.town || a.village || a.suburb || a.county || '';
  const first = d.name || (d.display_name || '').split(', ')[0];
  const parts = [first, city && city !== first ? city : '', a.state].filter(Boolean);
  return parts.length > 1 ? parts.join(', ') : (d.display_name || '').split(', ').slice(0, 3).join(', ');
}

function placeInput(container, placeholder, onPick) {
  container.innerHTML = `<div class="psearch"><div class="prow"><input placeholder="${esc(placeholder)}"><button class="ghost sm" type="button">Search</button></div><div class="plist hidden"></div></div>`;
  const inp = container.querySelector('input');
  const btn = container.querySelector('button');
  const list = container.querySelector('.plist');
  const state = { value: null };
  async function search() {
    const q = inp.value.trim();
    if (!q) return;
    btn.disabled = true;
    btn.textContent = '...';
    try {
      const res = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&q=' + encodeURIComponent(q));
      const data = await res.json();
      list.innerHTML = data.length
        ? data.map((d, i) => `<div class="popt" data-i="${i}">${esc(d.display_name)}</div>`).join('')
        : '<div class="popt none">No places found. Try adding the city name.</div>';
      list.classList.remove('hidden');
      list.querySelectorAll('.popt[data-i]').forEach(el => el.addEventListener('click', () => {
        const d = data[+el.dataset.i];
        state.value = { name: shortName(d), lat: +d.lat, lng: +d.lon };
        inp.value = state.value.name;
        list.classList.add('hidden');
        if (onPick) onPick(state.value);
      }));
    } catch (e) {
      toast('Place search failed. Check your internet connection.', true);
    }
    btn.disabled = false;
    btn.textContent = 'Search';
  }
  btn.addEventListener('click', search);
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); search(); } });
  inp.addEventListener('input', () => { if (state.value) { state.value = null; if (onPick) onPick(null); } });
  return state;
}

function render() {
  document.body.classList.toggle('landing', !me);
  clearInterval(chatTimer); chatTimer = null;
  if (!me) { renderBar(); return renderAuth(); }
  if (!tab || !tabsFor(me.role).some(t => t[0] === tab)) tab = me.role === 'DRIVER' ? 'post' : me.role === 'RIDER' ? 'search' : 'stats';
  if (!badgeTimer) badgeTimer = setInterval(refreshBadge, 15000);
  if (!render.resumed && me.role !== 'ADMIN') { render.resumed = true; resumeShares(); }
  renderBar();
  closeModal();
  $('app').innerHTML = '<div id="view"></div>';
  Promise.resolve(views[tab]()).catch(e => toast(e.message, true));
  refreshBadge();
}

function badgeTab() {
  return !me ? null : me.role === 'DRIVER' ? 'requests' : me.role === 'RIDER' ? 'bookings' : null;
}

function tabsFor(role) {
  if (role === 'DRIVER') return [['post', 'Post a ride'], ['myrides', 'My rides'], ['requests', 'Requests'], ['messages', 'Messages'], ['vehicles', 'Vehicles'], ['profile', 'Profile']];
  if (role === 'RIDER') return [['search', 'Find a ride'], ['bookings', 'My bookings'], ['messages', 'Messages'], ['profile', 'Profile']];
  return [['stats', 'Overview'], ['users', 'Users'], ['idchecks', 'ID checks'], ['reports', 'Reports'], ['allrides', 'Rides']];
}

function renderBar() {
  const tabs = me ? tabsFor(me.role) : [];
  const bt = badgeTab();
  const badgeFor = (k) => k === bt ? badgeSpan('badge', badgeCount) : k === 'messages' ? badgeSpan('mbadge', msgCount) : '';
  $('bar').innerHTML = `
    <div class="brand"><img src="/logo.svg" alt="HopIn logo"><span>Hop<b>In</b></span></div>
    <nav>${tabs.map(t => `<button class="pill ${tab === t[0] ? 'on' : ''}" onclick="go('${t[0]}')">${t[1]}${badgeFor(t[0])}</button>`).join('')}</nav>
    ${me ? `<div class="me">
      <button class="bell" onclick="openNotifications()" aria-label="Notifications" title="Notifications">🔔${badgeSpan('nbadge', notifCount)}</button>
      ${avatar(me)}
      <div><b>${esc(me.name)}</b>${me.verified ? ' <span class="vt" title="Verified">✔</span>' : ''}<div class="muted">${me.role}${me.role !== 'ADMIN' ? ' · ' + starLine(me) : ''}</div></div>
      <button class="theme-btn" onclick="toggleTheme()" aria-label="Switch colour theme">${themeLabel()}</button>
      <button class="ghost sm" onclick="logout()">Logout</button></div>` : ''}`;
}

async function refreshBadge() {
  if (!me || !token) return;
  try {
    const r = await api('GET', '/api/bookings/badge');
    badgeCount = r.count || 0;
    msgCount = r.messages || 0;
    notifCount = r.notifications || 0;
    [['badge', badgeCount], ['mbadge', msgCount], ['nbadge', notifCount]].forEach(([id, n]) => {
      const b = $(id);
      if (b) { b.textContent = n > 9 ? '9+' : n; b.classList.toggle('hidden', !n); }
    });
  } catch (e) { }
}

function go(t) { tab = t; render(); }

function renderAuth() {
  $('app').innerHTML = `
  <button class="theme-fab" onclick="toggleTheme()" aria-label="Switch colour theme">${themeLabel()}</button>
  <div class="land">
    <div class="intro">
      <img class="intro-logo" src="/logo.svg" alt="HopIn logo">
      <h1 class="intro-name">Hop<span>In</span></h1>
      <p class="intro-welcome">Welcome</p>
      <p class="intro-tag">Share the ride. Split the fare.</p>
      <ul class="intro-list">
        <li>See every ride on a live map with pickups and drop-offs</li>
        <li>Pay only for your stretch of the route</li>
        <li>Make an offer and bargain with the driver</li>
      </ul>
    </div>
    <div class="card auth-card">
      <h2 id="authTitle">Login</h2>
      <p class="sub" id="authSub">Login to find or offer a ride.</p>
      <div id="regFields" class="hidden">
        <label>Full name</label><input id="name" placeholder="Your name" onkeydown="authKey(event)">
        <label>I want to</label><select id="role" onkeydown="authKey(event)"><option value="RIDER">Ride with others</option><option value="DRIVER">Drive and share my car</option></select>
      </div>
      <label>Email</label><input id="email" type="email" placeholder="you@example.com" onkeydown="authKey(event)">
      <label>Password</label><input id="password" type="password" placeholder="At least 6 characters" onkeydown="authKey(event)">
      <button id="authBtn" style="width:100%" onclick="submitAuth()">Login</button>
      <p class="muted" style="text-align:center"><a href="#" onclick="toggleAuth();return false" id="toggleLink">New here? Create an account</a></p>
    </div>
  </div>`;
  registering = false;
}

function authKey(e) {
  if (e.key === 'Enter') { e.preventDefault(); submitAuth(); }
}

function toggleAuth() {
  registering = !registering;
  $('regFields').classList.toggle('hidden', !registering);
  $('authTitle').textContent = registering ? 'Create your account' : 'Login';
  $('authSub').textContent = registering ? 'It takes a few seconds.' : 'Login to find or offer a ride.';
  $('authBtn').textContent = registering ? 'Register' : 'Login';
  $('toggleLink').textContent = registering ? 'Have an account? Login' : 'New here? Create an account';
}

function submitAuth() {
  run(async () => {
    const body = { email: $('email').value, password: $('password').value };
    if (registering) { body.name = $('name').value; body.role = $('role').value; }
    const data = await api('POST', registering ? '/api/auth/register' : '/api/auth/login', body);
    token = data.token; me = data.user;
    localStorage.setItem('token', token); localStorage.setItem('me', JSON.stringify(me));
    registering = false; tab = null;
    render();
  });
}

function timeline(pts, opt = {}) {
  let list = pts.map((p, i) => ({ ...p, i }));
  if (opt.segment) list = list.filter(p => p.i >= opt.segment.from && p.i <= opt.segment.to);
  const first = list[0].i, last = list[list.length - 1].i;
  return '<div class="timeline">' + list.map(p => {
    let cls = p.i === first ? 'start' : p.i === last ? 'end' : 'in';
    let tag = '';
    if (opt.hi) {
      if (p.i !== opt.hi.from && p.i !== opt.hi.to) cls += ' dim';
      if (p.i === opt.hi.from) tag = '<span class="chip green">your pickup</span>';
      if (p.i === opt.hi.to) tag = '<span class="chip red">your drop-off</span>';
    }
    if (opt.segment) {
      if (p.i === first) tag = '<span class="chip green">From</span>';
      else if (p.i === last) tag = '<span class="chip red">To</span>';
    }
    return `<div class="tl ${cls}"><span class="dot"></span><span>${esc(p.name)}</span>${tag}</div>`;
  }).join('') + '</div>';
}

function fromTo(a, b) {
  return `<div style="margin-top:8px"><span class="ft"><b>From:</b>${esc(a)}</span><span class="ft"><b>To:</b>${esc(b)}</span></div>`;
}

function statusChip(s) {
  const map = { PENDING: 'amber', COUNTERED: 'teal', CONFIRMED: 'green', REJECTED: 'red', CANCELLED: 'gray', OPEN: 'green', COMPLETED: 'gray' };
  return `<span class="chip ${map[s] || ''}">${s}</span>`;
}

function prefChips(u) {
  const on = PREFS.filter(([k]) => u[k]);
  return on.length ? `<div class="chips">${on.map(([, l]) => `<span class="chip teal">${l}</span>`).join('')}</div>` : '';
}

function reviewRow(r) {
  return `<div class="rev"><div>${starIcons(r.score)} <b>${esc(r.from)}</b></div>${r.comment ? `<div class="muted">“${esc(r.comment)}”</div>` : ''}</div>`;
}

function givenScore(rideId, toId) {
  const g = myGiven.find(x => x.rideId === rideId && x.toUserId === toId);
  return g ? g.score : 0;
}

function openModal(html, small) {
  $('modalRoot').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box ${small ? 'small' : ''}">
    <button class="ghost sm close" onclick="closeModal()">Close</button>${html}</div></div>`;
}

function closeModal() { $('modalRoot').innerHTML = ''; }

function openRouteModal(ride, opt) {
  const pts = ridePoints(ride);
  const title = opt.segment ? `${esc(pts[opt.segment.from].name)} → ${esc(pts[opt.segment.to].name)}` : `${esc(ride.source)} → ${esc(ride.destination)}`;
  openModal(`<div style="margin:0 70px 10px 0"><div class="route">${title}</div><div class="muted">${fmt(ride.departTime)}</div></div>
    <div class="mapbox" id="modalMap"></div>${timeline(pts, opt)}`);
  loadMaps().then(() => {
    const m = newMap('modalMap');
    if (m) drawRoute(m, pts, { ...opt, onInfo: (km, min) => setInfo('modalMap', km != null ? km.toFixed(1) + ' km · ' + Math.round(min) + ' min' : null) });
  });
}

function showRide(id, p, d, mode) {
  const r = rideCache[id];
  if (!r) return;
  if (mode === 'seg') openRouteModal(r, { segment: { from: p, to: d } });
  else openRouteModal(r, p != null && d != null ? { hi: { from: p, to: d } } : {});
}

function cache(rides) { rides.forEach(r => rideCache[r.id] = r); }

function openRateModal(title, onSubmit) {
  openModal(`<h2>${esc(title)}</h2><p class="sub">Tap the stars, then submit. You can rate only once.</p>
    <div class="starpick" id="starpick">${[1, 2, 3, 4, 5].map(n => `<button type="button" class="sp" data-n="${n}" aria-label="${n} star">★</button>`).join('')}</div>
    <label>Comment (optional)</label><textarea id="rcomment" maxlength="300" rows="3" placeholder="How was the trip?"></textarea>
    <button id="rsubmit" style="width:100%">Submit rating</button>`, true);
  let score = 0;
  const btns = [...document.querySelectorAll('#starpick .sp')];
  const paint = (n) => btns.forEach(b => b.classList.toggle('on', +b.dataset.n <= n));
  btns.forEach(b => {
    b.onmouseenter = () => paint(+b.dataset.n);
    b.onclick = () => { score = +b.dataset.n; paint(score); };
  });
  $('starpick').onmouseleave = () => paint(score);
  $('rsubmit').onclick = () => {
    if (!score) return toast('Pick 1 to 5 stars', true);
    $('rsubmit').disabled = true;
    run(async () => {
      try { await onSubmit(score, $('rcomment').value.trim()); }
      finally { if ($('rsubmit')) $('rsubmit').disabled = false; }
    });
  };
}

function reportUser(id) {

function rideCard(r, reqs) {
  const pts = ridePoints(r);
  const pending = reqs.filter(b => b.ride.id === r.id && b.status === 'PENDING').length;
  const pax = reqs.filter(b => b.ride.id === r.id && b.status === 'CONFIRMED');
  let paxHtml = '';
  if (r.status === 'COMPLETED') {
    paxHtml = `<div class="pax"><b>Passengers</b>${pax.length ? pax.map(b => {
      const g = givenScore(r.id, b.rider.id);
      return `<div class="paxrow"><div>${nameLink(b.rider)} <span class="muted">· ${b.seats} seat(s) · ${b.paid ? 'paid ' + inr(b.amountPaid) : 'not paid yet'}</span></div>
        ${g ? `<span>${starIcons(g)} <span class="muted">rated</span></span>` : `<button class="sm" onclick="ratePassenger(${r.id},${b.rider.id})">Rate passenger</button>`}</div>`;
    }).join('') : '<p class="muted" style="margin:6px 0 0">No passengers on this ride.</p>'}</div>`;
  } else if (r.status === 'OPEN' && pax.length) {
    paxHtml = `<div class="pax"><b>Confirmed passengers</b>${pax.map(b => `<div class="paxrow"><div>${nameLink(b.rider)}
        <span class="muted">· ${b.seats} seat(s) · ${esc(b.pickupName)} → ${esc(b.dropName)}</span></div>
        <button class="ghost sm" onclick="openChat(${r.id},${b.rider.id})">💬 Message</button></div>`).join('')}</div>`;
  }
  return `<div class="item"><div class="head"><div><div class="route">${esc(r.source)} → ${esc(r.destination)}</div>
      <div class="muted">${fmt(r.departTime)} · ${r.seatsLeft}/${r.seatsTotal} seats left</div></div>
      <div style="text-align:right"><div class="price">${inr(r.pricePerSeat)} <small>/ seat, full route</small></div>
      ${statusChip(r.status)}${r.negotiable ? '<span class="chip teal">negotiable</span>' : '<span class="chip gray">fixed price</span>'}</div></div>
    ${timeline(pts)}${paxHtml}
    <div class="actions"><button class="ghost sm" onclick="showRide(${r.id})">View on map</button>
      ${r.status === 'OPEN' ? `${pending ? `<button class="warn sm" onclick="go('requests')">${pending} request(s) waiting</button>` : ''}
        <button class="ghost sm" onclick="tripTools(${r.id})">🛡️ Trip tools</button>
        ${shares[r.id] ? '<span class="chip green">● Sharing live</span>' : ''}
        <button class="ok sm" onclick="rideAction(${r.id},'complete')">Mark completed</button>
        <button class="bad sm" onclick="rideAction(${r.id},'cancel')">Cancel ride</button>` : ''}</div></div>`;
}

function draftPoints() {
  const pts = [];
  if (draft.from) pts.push(draft.from);
  draft.stops.forEach(s => pts.push(s));
  if (draft.to) pts.push(draft.to);
  return pts;
}

  placeInput($('stopBox'), 'Add a stop (riders can join or leave here)', (v) => {
    if (!v) return;
    if (draft.stops.length >= 5) { toast('Maximum 5 in-between stops', true); return; }
    draft.stops.push(v);
    mountStopInput();
    window.redrawPost();
  });
}

function updateStops() {
  const el = $('stopList');
  if (!el) return;
  el.innerHTML = draft.stops.map((s, i) => `<div class="stopchip"><span class="n">${i + 1}</span><span class="t">${esc(s.name)}</span>
    <button class="ghost sm" onclick="moveStop(${i},-1)">▲</button><button class="ghost sm" onclick="moveStop(${i},1)">▼</button>
    <button class="bad sm" onclick="removeStop(${i})">✕</button></div>`).join('');
}

function moveStop(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= draft.stops.length) return;
  [draft.stops[i], draft.stops[j]] = [draft.stops[j], draft.stops[i]];
  window.redrawPost();
}

function removeStop(i) {
  draft.stops.splice(i, 1);
  window.redrawPost();
}

function segOf(id) {

function changeSeg(id, which) {
  const r = rideCache[id], pts = ridePoints(r), last = pts.length - 1;
  let { p, d } = segOf(id);
  if (which === 'p') {
    const sel = $('dp' + id);
    const keep = d > p ? d : last;
    sel.innerHTML = pts.map((x, i) => i > p ? `<option value="${i}">${esc(x.name)}</option>` : '').join('');
    sel.value = String(keep);
    d = +sel.value;
  }
  const price = segPrice(r.pricePerSeat, pts, p, d);
  $('lp' + id).innerHTML = inr(price) + ' <small>/ seat</small>';
  $('of' + id).value = price;
  $('tl' + id).innerHTML = timeline(pts, { hi: { from: p, to: d } });
  focusRide(id);
}

function routeKm() {
  if (roadKm != null) return roadKm;
  const pts = draftPoints();
  if (pts.length < 2 || !pts.every(p => p.lat != null)) return null;
  let d = 0;
  for (let i = 0; i < pts.length - 1; i++) d += haversine(pts[i], pts[i + 1]);
  return d * 1.25;
}

function updatePriceHint(price) {
  const el = $('priceHint');
  if (!el) return;
  const km = routeKm();
  if (!price || km == null) { el.classList.add('hidden'); return; }
  const low = roundTen(km * 2), high = Math.max(low, roundTen(km * 3.5));
  const range = `${inr(low)}–${inr(high)} for about ${Math.round(km)} km`;
  let cls, text;
  if (price < low) { cls = 'amber'; text = `Below the recommended range (${range}). Riders will love it, but check it covers your fuel and tolls.`; }
  else if (price > high) { cls = 'red'; text = `Above the recommended range (${range}). Riders often skip pricier rides.`; }
  else { cls = 'green'; text = `Within the recommended range (${range}).`; }
  el.className = 'price-hint ' + cls;
  el.textContent = text;
}

function updateLegs() {
  const el = $('legs');
  if (!el) return;
  const pts = draftPoints();
  const raw = +($('price') && $('price').value);
  updatePriceHint(raw ? roundTen(raw) : 0);
  if (pts.length < 2 || !raw) { el.textContent = ''; return; }
  const price = roundTen(raw);
  const parts = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = i === 0 ? 'A' : String(i), b = i === pts.length - 2 ? 'B' : String(i + 1);
    parts.push(`${a} → ${b}: ${inr(segPrice(price, pts, i, i + 1))}`);
  }
  el.textContent = 'Fare by stretch (per seat, rounded to ₹10): ' + parts.join(' · ') + '. Total ' + inr(price) + '. Riders pay only for the part they travel.';
}

const meetCache = {};
let meetSeq = 0;

async function nearbySpots(p) {
  const key = p.lat.toFixed(4) + ',' + p.lng.toFixed(4);
  if (meetCache[key]) return meetCache[key];
  const q = `[out:json][timeout:15];(
    node["amenity"="fuel"](around:2500,${p.lat},${p.lng});
    node["highway"="motorway_junction"](around:4000,${p.lat},${p.lng});
    node["amenity"="bus_station"](around:2500,${p.lat},${p.lng});
    node["highway"="bus_stop"]["name"](around:1200,${p.lat},${p.lng});
  );out body 60;`;
  const res = await fetch('https://overpass-api.de/api/interpreter', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'data=' + encodeURIComponent(q)
  });
  const data = await res.json();
  const seen = new Set();
  const out = (data.elements || []).map(e => {
    const t = e.tags || {};
    const kind = t.amenity === 'fuel' ? 'fuel' : t.highway === 'motorway_junction' ? 'exit' : 'bus';
    const label = t.name || t.brand || (kind === 'fuel' ? 'Fuel station' : kind === 'exit' ? 'Highway exit' + (t.ref ? ' ' + t.ref : '') : 'Bus stop');
    return { kind, label, lat: e.lat, lng: e.lon, km: haversine(p, { lat: e.lat, lng: e.lon }) };
  }).filter(s => {
    const k = s.label.toLowerCase();
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  }).sort((a, b) => (a.label === 'Fuel station' || a.label === 'Bus stop') - (b.label === 'Fuel station' || b.label === 'Bus stop') || a.km - b.km).slice(0, 3);
  meetCache[key] = out;
  return out;
}

async function suggestMeetingPoints() {
  const box = $('meetBox');
  if (!box) return;
  const seq = ++meetSeq;
  const pts = [];
  if (draft.from) pts.push({ p: draft.from, slot: 'from', label: 'A' });
  draft.stops.forEach((s, i) => pts.push({ p: s, slot: 'stop' + i, label: String(i + 1) }));
  if (draft.to) pts.push({ p: draft.to, slot: 'to', label: 'B' });
  const withCoords = pts.filter(x => x.p.lat != null);
  if (!withCoords.length) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="meet"><b>Suggested meeting points</b><p class="muted">Looking for fuel stations, bus stands and highway exits nearby…</p></div>';
  const rows = [];
  for (const x of withCoords) {
    try {
      const spots = await nearbySpots(x.p);
      if (seq !== meetSeq) return;
      if (spots.length) rows.push({ x, spots });
    } catch (e) {
      if (seq !== meetSeq) return;
    }
  }
  window.meetRows = rows;
  box.innerHTML = `<div class="meet"><b>Suggested meeting points</b>
    <p class="muted">Easy pickup spots near your route. Tap Use to swap a point for one of these.</p>
    ${rows.length ? rows.map((r, ri) => `<div class="meet-row"><span class="mnum sm-pin">${r.x.label}</span><div style="flex:1;min-width:0">
      <div class="muted">${esc(r.x.p.name)}</div>${r.spots.map((s, si) => `<div class="spot"><span>${s.kind === 'fuel' ? '⛽' : s.kind === 'exit' ? '🛣️' : '🚌'} ${esc(s.label)} <span class="muted">· ${s.km.toFixed(1)} km</span></span>
      <button class="ghost sm" onclick="useSpot(${ri},${si})">Use</button></div>`).join('')}</div></div>`).join('')
      : '<p class="muted">No suggestions found near these points.</p>'}</div>`;
}

function useSpot(ri, si) {
  const r = window.meetRows && window.meetRows[ri];
  if (!r) return;
  const s = r.spots[si];
  const town = (r.x.p.name || '').split(', ').slice(-2).join(', ');
  const point = { name: s.label + (town ? ', ' + town : ''), lat: s.lat, lng: s.lng };
  if (r.x.slot === 'from') { draft.from = point; const i = $('fromBox').querySelector('input'); if (i) i.value = point.name; }
  else if (r.x.slot === 'to') { draft.to = point; const i = $('toBox').querySelector('input'); if (i) i.value = point.name; }
  else draft.stops[+r.x.slot.slice(4)] = point;
  toast('Meeting point updated');
  window.redrawPost();
}

function clearGeo(which) {
  if (which === 'from') { geoFrom = null; $('fsGeo').textContent = ''; }
  else { geoTo = null; $('fdGeo').textContent = ''; }
}

function setGeo(which, g) {
  if (which === 'from') { geoFrom = g; $('fs').value = g.name; $('fs').classList.remove('err'); }
  else { geoTo = g; $('fd').value = g.name; $('fd').classList.remove('err'); }
  $(which === 'from' ? 'fsGeo' : 'fdGeo').textContent = '📍 Searching by distance from this exact spot';
}

function findPlace(which) {
  const input = $(which === 'from' ? 'fs' : 'fd');
  const list = $(which === 'from' ? 'fsList' : 'fdList');
  const q = input.value.trim();
  if (!q) return toast('Type a place first', true);
  run(async () => {
    const res = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&q=' + encodeURIComponent(q));
    const data = await res.json();
    list.innerHTML = data.length ? data.map((d, i) => `<div class="popt" data-i="${i}">${esc(d.display_name)}</div>`).join('')
      : '<div class="popt none">No places found. Try adding the city name.</div>';
    list.classList.remove('hidden');
    list.querySelectorAll('.popt[data-i]').forEach(el => el.addEventListener('click', () => {
      const d = data[+el.dataset.i];
      list.classList.add('hidden');
      setGeo(which, { name: shortName(d), lat: +d.lat, lng: +d.lon });
    }));
  });
}

function nearMe() {
  if (!navigator.geolocation) return toast('Your browser cannot share location', true);
  $('fsGeo').textContent = 'Getting your location…';
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const g = { name: 'My location', lat: pos.coords.latitude, lng: pos.coords.longitude };
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&lat=${g.lat}&lon=${g.lng}`);
      const d = await r.json();
      if (d && d.address) g.name = shortName(d);
    } catch (e) { }
    setGeo('from', g);
  }, () => {
    $('fsGeo').textContent = '';
    toast('Location permission is needed for rides near you', true);
  }, { enableHighAccuracy: true, timeout: 15000 });
}

function searchParams() {
  const q = { source: $('fs').value.trim(), destination: $('fd').value.trim(), date: $('fdate').value, seats: $('fseats').value };
  if (geoFrom) { q.fromLat = geoFrom.lat; q.fromLng = geoFrom.lng; }
  if (geoTo) { q.toLat = geoTo.lat; q.toLng = geoTo.lng; }
  if (geoFrom || geoTo) q.radiusKm = $('frad').value;
  return q;
}

function searchRides() {
  const ids = ['fs', 'fd', 'fdate', 'fseats'];
  const missing = ids.filter(k => !$(k).value.trim() || (k === 'fseats' && +$(k).value < 1));
  ids.forEach(k => $(k).classList.toggle('err', missing.includes(k)));
  if (missing.length) {
    $('results').innerHTML = '<div class="card banner" style="margin:0 0 16px">Please fill in From, To, Date and Seats (highlighted in red).</div>';
    if (curMap) { clearMap(curMap); curMap._seq++; setInfo('map', null); }
    return;
  }
  run(async () => {
    lastResults = await api('GET', '/api/rides/search?' + new URLSearchParams(searchParams()));
    cache(lastResults.map(v => v.ride));
    $('results').innerHTML = lastResults.length ? lastResults.map(cardFor).join('')
      : `<div class="card empty"><b>No rides for this route</b><p class="muted">Try another date, a bigger radius, or a nearby town on the same route.</p>
        <button onclick="createAlert()">🔔 Alert me when a ride is posted</button></div>`;
    if (lastResults.length) focusRide(lastResults[0].ride.id);
    else if (curMap) { clearMap(curMap); curMap._seq++; setInfo('map', null); }
  });
}

function createAlert() {
  run(async () => {
    const q = searchParams();
    await api('POST', '/api/alerts', {
      source: q.source, destination: q.destination, date: q.date || null, seats: +q.seats || 1,
      fromLat: q.fromLat ?? null, fromLng: q.fromLng ?? null, toLat: q.toLat ?? null, toLng: q.toLng ?? null,
      radiusKm: q.radiusKm ? +q.radiusKm : null
    });
    toast("Alert saved. We'll notify you when a matching ride is posted");
    loadAlerts();
  });
}

async function loadAlerts() {
  const box = $('alertsBox');
  if (!box || !me || me.role !== 'RIDER') return;
  try {
    const list = await api('GET', '/api/alerts');
    box.innerHTML = list.length ? `<div class="card"><h3>🔔 My ride alerts</h3>${list.map(a => `<div class="paxrow">
      <div><b>${esc(a.source)} → ${esc(a.destination)}</b><div class="muted">${a.date ? new Date(a.date + 'T00:00').toLocaleDateString([], { dateStyle: 'medium' }) : 'Any date'} · ${a.seats} seat(s)${a.fromLat != null || a.toLat != null ? ' · within ' + a.radiusKm + ' km' : ''}</div></div>
      <button class="ghost sm" onclick="deleteAlert(${a.id})">Delete</button></div>`).join('')}</div>` : '';
  } catch (e) { }
}

function deleteAlert(id) {
  run(async () => { await api('DELETE', `/api/alerts/${id}`); toast('Alert deleted'); loadAlerts(); });
}

function extras(v) {
  const dr = v.driverReviews || [], cp = v.coPassengers || [];
  return `<div class="extras" onclick="event.stopPropagation()">
    <details><summary>Driver reviews (${dr.length})</summary>${v.driverSummary ? `<div class="summary">${esc(v.driverSummary)}</div>` : ''}${dr.length ? dr.map(reviewRow).join('') : '<p class="muted">No reviews yet.</p>'}</details>
    <details><summary>Co-passengers on this trip (${cp.length})</summary>${cp.length ? cp.map(c => `<div class="rev">
      <div>${nameLink(c)} <span class="muted">· ${starLine(c)} · ${c.seats} seat(s)</span></div>
      <div class="muted"><b>From:</b> ${esc(c.pickup)} &nbsp; <b>To:</b> ${esc(c.drop)}</div>
      ${c.lastReview ? `<div class="muted">Latest review: ${starIcons(c.lastReview.score)} ${c.lastReview.comment ? '“' + esc(c.lastReview.comment) + '”' : ''} — ${esc(c.lastReview.from)}</div>` : '<div class="muted">No reviews yet.</div>'}
    </div>`).join('') : '<p class="muted">No one has booked yet.</p>'}</details></div>`;
}

function cardFor(v) {
  const r = v.ride, pts = ridePoints(r), last = pts.length - 1;
  const pOpts = pts.slice(0, last).map((p, i) => `<option value="${i}" ${i === v.pickupIdx ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  const dOpts = pts.map((p, i) => i > v.pickupIdx ? `<option value="${i}" ${i === v.dropIdx ? 'selected' : ''}>${esc(p.name)}</option>` : '').join('');
  const dist = (v.pickupKm != null ? `<span class="chip teal">📍 Pickup ${v.pickupKm} km from you</span>` : '')
    + (v.dropKm != null ? `<span class="chip teal">🏁 Drop-off ${v.dropKm} km from your destination</span>` : '');
  return `<div class="item" id="card${r.id}" onclick="focusRide(${r.id})">
    <div class="head"><div class="who">${avatar(r.driver)}<div><div class="route">${esc(r.source)} → ${esc(r.destination)}</div>
      <div class="muted">${fmt(r.departTime)} · ${r.seatsLeft} seat(s) left</div>
      <div class="muted" onclick="event.stopPropagation()">Driver: ${nameLink(r.driver)} · ${starLine(r.driver)}</div></div></div>
      <div style="text-align:right"><div class="price" id="lp${r.id}">${inr(v.listPrice)} <small>/ seat</small></div>
      ${r.negotiable ? '<span class="chip teal">bargain allowed</span>' : '<span class="chip gray">fixed price</span>'}
      <span class="chip">match ${v.score}</span></div></div>
    ${dist ? `<div class="chips">${dist}</div>` : ''}
    ${prefChips(r.driver)}
    <div id="tl${r.id}">${timeline(pts, { hi: { from: v.pickupIdx, to: v.dropIdx } })}</div>
    <div class="grid2" onclick="event.stopPropagation()">
      <div><label>Pickup</label><select id="pk${r.id}" onchange="changeSeg(${r.id},'p')">${pOpts}</select></div>
      <div><label>Drop-off</label><select id="dp${r.id}" onchange="changeSeg(${r.id},'d')">${dOpts}</select></div>
      <div><label>Seats</label><input id="bs${r.id}" type="number" min="1" max="${r.seatsLeft}" value="${Math.min(r.seatsLeft, +$('fseats').value || 1)}"></div>
      <div><label>${r.negotiable ? 'Your offer per seat (₹, multiple of 10)' : 'Price per seat (₹)'}</label>
        <input id="of${r.id}" type="number" min="10" step="10" value="${v.listPrice}" ${r.negotiable ? '' : 'disabled'} onchange="this.value = roundTen(this.value)"></div>
    </div>
    ${extras(v)}
    <div class="actions" onclick="event.stopPropagation()" style="margin-top:10px">
      <button onclick="bookRide(${r.id})">${r.negotiable ? 'Send offer' : 'Request seats'}</button>
      <button class="ghost sm" onclick="openChat(${r.id},${me.id})">💬 Message driver</button>
      <button class="ghost sm" onclick="showRide(${r.id},+$('pk${r.id}').value,+$('dp${r.id}').value)">Full map</button>
    </div></div>`;
}

function timeAgo(d) {
  if (!d) return '';
  const s = Math.round((Date.now() - new Date(d)) / 1000);
  if (s < 45) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  return new Date(d).toLocaleDateString([], { day: 'numeric', month: 'short' });
}

function convRow(c) {
  const sel = chatOpen && chatOpen.rideId === c.rideId && chatOpen.riderId === c.riderId;
  return `<div class="conv ${sel ? 'sel' : ''}" id="conv-${c.rideId}-${c.riderId}" onclick="loadThread(${c.rideId},${c.riderId})">
    ${avatar(c.other)}<div class="conv-main"><div class="conv-top"><b>${esc(c.other.name)}</b><span class="muted">${timeAgo(c.lastAt)}</span></div>
    <div class="muted conv-route">${esc(c.route)} · ${new Date(c.departTime).toLocaleDateString([], { day: 'numeric', month: 'short' })}</div>
    <div class="conv-last">${c.lastMine ? 'You: ' : ''}${esc(c.lastText)}</div></div>
    ${c.unread ? `<span class="badge static">${c.unread}</span>` : ''}</div>`;
}

function openChat(rideId, riderId) {
  chatOpen = { rideId, riderId };
  closeModal();
  go('messages');
}

function bubbles(t) {
  if (!t.messages.length) return `<div class="mapnote"><div>No messages yet.<br>Say hello and ask about pickup, luggage or timing.</div></div>`;
  return t.messages.map(m => `<div class="bubble ${m.senderId === me.id ? 'mine' : 'theirs'}"><div>${esc(m.text)}</div><span>${new Date(m.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</span></div>`).join('');
}

async function loadThread(rideId, riderId) {
  chatOpen = { rideId, riderId };
  document.querySelectorAll('.conv').forEach(el => el.classList.toggle('sel', el.id === `conv-${rideId}-${riderId}`));
  const pane = $('chatPane');
  if (!pane) return;
  try {
    const t = await api('GET', `/api/chats/${rideId}/${riderId}`);
    nameCache[t.other.id] = t.other.name;
    pane.innerHTML = `<div class="chat-head">${avatar(t.other)}<div><b>${nameLink(t.other)}</b>
        <div class="muted">${esc(t.route)} · ${fmt(t.departTime)} ${t.rideStatus !== 'OPEN' ? '· ' + t.rideStatus.toLowerCase() : ''}</div></div></div>
      <div class="msgs" id="msgs">${bubbles(t)}</div>
      ${t.blocked ? '<div class="banner" style="margin:10px 0 0">You can\'t message this person because one of you has blocked the other.</div>'
        : `<div class="composer"><textarea id="chatText" rows="1" maxlength="1000" placeholder="Write a message…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}"></textarea>
        <button onclick="sendChat()">Send</button></div>`}`;
    pane.dataset.count = t.messages.length;
    const box = $('msgs');
    box.scrollTop = box.scrollHeight;
    const conv = $(`conv-${rideId}-${riderId}`);
    if (conv) { const b = conv.querySelector('.badge'); if (b) b.remove(); }
    refreshBadge();
    clearInterval(chatTimer);
    chatTimer = setInterval(() => pollThread(rideId, riderId), 5000);
  } catch (e) {
    pane.innerHTML = `<div class="mapnote">${esc(e.message)}</div>`;
  }
}

async function pollThread(rideId, riderId) {
  const pane = $('chatPane');
  if (!pane || !chatOpen || chatOpen.rideId !== rideId || chatOpen.riderId !== riderId) { clearInterval(chatTimer); return; }
  try {
    const t = await api('GET', `/api/chats/${rideId}/${riderId}`);
    if (String(t.messages.length) !== pane.dataset.count) {
      pane.dataset.count = t.messages.length;
      const box = $('msgs');
      box.innerHTML = bubbles(t);
      box.scrollTop = box.scrollHeight;
    }
  } catch (e) { }
}

function sendChat() {
  const input = $('chatText');
  const text = input.value.trim();
  if (!text || !chatOpen) return;
  const { rideId, riderId } = chatOpen;
  input.disabled = true;
  run(async () => {
    try {
      await api('POST', `/api/chats/${rideId}/${riderId}`, { text });
      input.value = '';
      await pollThread(rideId, riderId);
      const list = await api('GET', '/api/chats');
      const convs = $('convs');
      if (convs) convs.innerHTML = list.map(convRow).join('');
    } finally {
      input.disabled = false;
      input.focus();
    }
  });
}

function openNotifications() {
  run(async () => {
    const list = await api('GET', '/api/notifications');
    window.notifList = list;
    openModal(`<h2>Notifications</h2>${list.length ? list.map((n, i) => `<div class="notif ${n.seen ? '' : 'unread'}" onclick="openNotif(${i})">
        <div>${esc(n.text)}</div><span class="muted">${timeAgo(n.createdAt)}</span></div>`).join('') : '<p class="muted">Nothing new yet.</p>'}`, true);
    if (list.some(n => !n.seen)) {
      await api('POST', '/api/notifications/read');
      notifCount = 0;
      refreshBadge();
    }
  });
}

function openNotif(i) {
  const n = window.notifList && window.notifList[i];
  if (!n) return;
  closeModal();
  if (!n.tab || !tabsFor(me.role).some(t => t[0] === n.tab)) return;
  if (n.tab === 'search') pendingSearch = { from: n.searchFrom, to: n.searchTo, date: n.searchDate };
  go(n.tab);
}

function shareLink(t) {
  return location.origin + '/track.html#' + t;
}

function shareHtml(rideId) {
  const s = shares[rideId];
  const link = shareLink(s.token);
  return `<div class="note">● Sharing is on. ${s.last ? 'Location last sent ' + timeAgo(s.last) + '.' : 'Waiting for your location…'} Keep this page open while you travel.</div>
    <input readonly value="${esc(link)}" onclick="this.select()">
    <div class="actions"><button class="ghost sm" onclick="copyLink(${rideId})">Copy link</button>
    <a class="btn ghost sm" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Track my HopIn ride live: ' + link)}">Share on WhatsApp</a>
    <button class="bad sm" onclick="stopShare(${rideId})">Stop sharing</button></div>
    ${location.hostname === 'localhost' || location.hostname === '127.0.0.1' ? '<p class="muted">This link only works on this computer while HopIn runs on localhost. Once HopIn is online, anyone with the link can open it.</p>' : ''}`;
}

function tripTools(rideId) {
  const r = rideCache[rideId];
  if (!r) return;
  openModal(`<h2>🛡️ Trip tools</h2><p class="sub">${esc(r.source)} → ${esc(r.destination)} · ${fmt(r.departTime)}</p>
    <div class="sos-box"><b>In an emergency</b><p class="muted" style="margin:4px 0 10px">Call the national emergency number, and alert the HopIn team with your location.</p>
      <div class="actions"><a class="btn bad" href="tel:112">📞 Call 112</a><button class="bad" id="sosBtn" onclick="sendSos(${rideId})">🚨 Send SOS to HopIn</button></div>
      <div id="sosMsg"></div></div>
    <h3 style="margin-top:18px">Share live location</h3>
    <p class="muted">Send family or friends a link that shows where you are on a map, until you stop sharing.</p>
    <div id="shareBox">${shares[rideId] ? shareHtml(rideId) : `<button onclick="startShare(${rideId})">📍 Start sharing live location</button>`}</div>`, true);
}

function refreshShareBox(rideId) {
  const box = $('shareBox');
  if (box) box.innerHTML = shares[rideId] ? shareHtml(rideId) : `<button onclick="startShare(${rideId})">📍 Start sharing live location</button>`;
  updateLiveChip();
}

function startShare(rideId) {
  if (!navigator.geolocation) return toast('Your browser cannot share location', true);
  run(async () => {
    const s = await api('POST', '/api/live/start', { rideId });
    shares[rideId] = { token: s.token };
    beginWatch(rideId);
    refreshShareBox(rideId);
    toast('Live sharing started');
  });
}

function beginWatch(rideId) {
  const s = shares[rideId];
  if (!s || !navigator.geolocation || s.watchId != null) return;
  s.watchId = navigator.geolocation.watchPosition(pos => pushLocation(rideId, pos), () => {
    toast('Allow location access so your trip can be shared', true);
  }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 });
  updateLiveChip();
}

function pushLocation(rideId, pos) {
  const s = shares[rideId];
  if (!s || (s.sentAt && Date.now() - s.sentAt < 10000)) return;
  s.sentAt = Date.now();
  api('POST', `/api/live/${s.token}/location`, { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy })
    .then(() => { s.last = new Date(); if ($('shareBox')) refreshShareBox(rideId); })
    .catch(e => { if (/ended|not found/i.test(e.message)) { stopWatch(rideId); delete shares[rideId]; updateLiveChip(); } });
}

function stopWatch(rideId) {
  const s = shares[rideId];
  if (s && s.watchId != null && navigator.geolocation) navigator.geolocation.clearWatch(s.watchId);
  if (s) s.watchId = null;
}

function stopShare(rideId) {
  const s = shares[rideId];
  if (!s) return;
  run(async () => {
    await api('POST', `/api/live/${s.token}/stop`);
    stopWatch(rideId);
    delete shares[rideId];
    refreshShareBox(rideId);
    toast('Live sharing stopped');
  });
}

function copyLink(rideId) {
  const link = shareLink(shares[rideId].token);
  if (navigator.clipboard) navigator.clipboard.writeText(link).then(() => toast('Link copied')).catch(() => toast('Select the link and copy it', true));
  else toast('Select the link and copy it', true);
}

async function resumeShares() {
  try {
    const list = await api('GET', '/api/live/active');
    list.forEach(s => { shares[s.rideId] = { token: s.token }; beginWatch(s.rideId); });
    updateLiveChip();
  } catch (e) { }
}

function updateLiveChip() {
  const ids = Object.keys(shares);
  const chip = $('liveChip');
  if (!chip) return;
  chip.classList.toggle('hidden', !ids.length || !me);
  chip.innerHTML = `<span class="dotlive"></span> Sharing live location${ids.length > 1 ? ' (' + ids.length + ' trips)' : ''}`;
  chip.onclick = () => { if (ids.length) { if (!rideCache[ids[0]]) return go(me.role === 'DRIVER' ? 'myrides' : 'bookings'); tripTools(+ids[0]); } };
}

function sendSos(rideId) {
  const btn = $('sosBtn');
  if (btn) btn.disabled = true;
  const send = (lat, lng) => run(async () => {
    try {
      await api('POST', '/api/sos', { rideId, lat, lng });
      const m = $('sosMsg');
      if (m) m.innerHTML = '<div class="banner" style="margin:10px 0 0">SOS sent. The HopIn team has your location. If you are in danger, call 112 now. Sharing your live location with family also helps.</div>';
    } finally {
      if (btn) btn.disabled = false;
    }
  });
  if (!navigator.geolocation) return send(null, null);
  navigator.geolocation.getCurrentPosition(p => send(p.coords.latitude, p.coords.longitude), () => send(null, null), { enableHighAccuracy: true, timeout: 8000 });
}

    localStorage.setItem('me', JSON.stringify(me));

}

function resizeImage(file, size) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const side = Math.min(img.width, img.height);
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file is not an image we can read')); };
    img.src = url;
  });
}

function uploadPhoto(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  run(async () => {
    const dataUrl = await resizeImage(f, 320);
    me = await api('PUT', '/api/users/me/photo', { dataUrl });
    localStorage.setItem('me', JSON.stringify(me));
    toast('Photo updated');
    render();
  });
}

function removePhoto() {
  run(async () => {
    me = await api('DELETE', '/api/users/me/photo');
    localStorage.setItem('me', JSON.stringify(me));
    toast('Photo removed');
    render();
  });
}

function decideId(id, action) {
  run(async () => { await api('POST', `/api/admin/users/${id}/${action}`); toast(action === 'id-approve' ? 'ID approved' : 'ID rejected'); render(); });
}

function resolveReport(id) {
  run(async () => { await api('POST', `/api/admin/reports/${id}/resolve`); toast('Marked resolved'); render(); });
}

render();
if (token && me) {
  api('GET', '/api/users/me').then(u => { me = u; localStorage.setItem('me', JSON.stringify(me)); renderBar(); refreshBadge(); }).catch(() => { });
}
</script>
</body>
</html>
