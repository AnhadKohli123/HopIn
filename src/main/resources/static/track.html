<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HopIn Live Trip</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#f3f6fb; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --ok:#16a34a; --bad:#dc2626; --brand:#2563eb; color-scheme:light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1220; --card:#111a2b; --ink:#e5e7eb; --muted:#94a3b8; --line:#23304a; --brand:#3b82f6; color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font-family:Inter, system-ui, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  header img { width:34px; height:34px; border-radius:9px; }
  header b { font-size:18px; }
  .info { padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center; font-size:14px; }
  .muted { color:var(--muted); font-size:13px; }
  .pill { display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:13px; padding:4px 10px; border-radius:99px; background:#dcfce7; color:#166534; }
  .pill.off { background:#e2e8f0; color:#334155; }
  .dot { width:9px; height:9px; border-radius:50%; background:#16a34a; animation:pulse 1.6s infinite; }
  .pill.off .dot { background:#64748b; animation:none; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(22,163,74,.6); } 70% { box-shadow:0 0 0 9px rgba(22,163,74,0); } 100% { box-shadow:0 0 0 0 rgba(22,163,74,0); } }
  #map { flex:1; min-height:300px; }
  .msg { margin:auto; text-align:center; padding:40px 20px; color:var(--muted); }
  .me-pin { width:22px; height:22px; border-radius:50%; background:#2563eb; border:4px solid #fff; box-shadow:0 0 0 6px rgba(37,99,235,.25), 0 2px 6px rgba(0,0,0,.4); }
  .end-pin { width:14px; height:14px; border-radius:50%; border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .sos { margin-left:auto; }
  .sos a { display:inline-block; background:var(--bad); color:#fff; font-weight:700; text-decoration:none; padding:7px 12px; border-radius:10px; font-size:13px; }
</style>
</head>
<body>
<header><img src="/logo.svg" alt="HopIn logo"><b>HopIn</b><span class="muted">Live trip</span></header>
<div class="info" id="info"><span class="muted">Loading trip…</span></div>
<div id="map"></div>

<script>
const token = (location.hash || '').slice(1) || new URLSearchParams(location.search).get('t');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
let map = null, marker = null, ring = null, fitted = false, routeDrawn = false;

function ago(d) {
  if (!d) return 'no location yet';
  const s = Math.round((Date.now() - new Date(d)) / 1000);
  if (s < 45) return 'updated just now';
  if (s < 3600) return 'updated ' + Math.floor(s / 60) + ' min ago';
  return 'updated ' + new Date(d).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
}

function showMessage(text) {
  document.getElementById('info').innerHTML = '';
  document.getElementById('map').innerHTML = `<div class="msg">${esc(text)}</div>`;
}

function ensureMap() {
  if (map || typeof L === 'undefined') return;
  map = L.map('map').setView([22.5, 79], 5);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/' + (dark ? 'dark_all' : 'voyager') + '/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', maxZoom: 20, attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
  }).addTo(map);
}

function drawRoute(points) {
  if (routeDrawn || !map) return;
  const ok = points.filter(p => p.lat != null && p.lng != null);
  if (ok.length < 2) return;
  routeDrawn = true;
  const coords = ok.map(p => p.lng + ',' + p.lat).join(';');
  const pin = (color) => L.divIcon({ className: '', html: `<div class="end-pin" style="background:${color}"></div>`, iconSize: [14, 14], iconAnchor: [7, 7] });
  L.marker([ok[0].lat, ok[0].lng], { icon: pin('#16a34a') }).addTo(map).bindTooltip(esc(ok[0].name));
  L.marker([ok[ok.length - 1].lat, ok[ok.length - 1].lng], { icon: pin('#dc2626') }).addTo(map).bindTooltip(esc(ok[ok.length - 1].name));
  fetch('https://router.project-osrm.org/route/v1/driving/' + coords + '?overview=full&geometries=geojson')
    .then(r => r.json())
    .then(d => {
      const line = d.code === 'Ok' ? d.routes[0].geometry.coordinates.map(c => [c[1], c[0]]) : ok.map(p => [p.lat, p.lng]);
      L.polyline(line, { color: '#1d4ed8', weight: 8, opacity: 0.35 }).addTo(map);
      L.polyline(line, { color: '#4f8ef7', weight: 4 }).addTo(map);
      if (!marker) map.fitBounds(L.latLngBounds(line), { padding: [40, 40] });
    })
    .catch(() => { });
}

async function refresh() {
  if (!token) return showMessage('This tracking link is incomplete. Ask for the link again.');
  let d;
  try {
    const res = await fetch('/api/public/live/' + encodeURIComponent(token));
    d = await res.json();
    if (!res.ok) return showMessage(d.message || 'This tracking link does not exist.');
  } catch (e) {
    document.getElementById('info').innerHTML = '<span class="muted">Connection problem. Retrying…</span>';
    return;
  }
  document.getElementById('info').innerHTML = `
    <span class="pill ${d.active ? '' : 'off'}"><span class="dot"></span>${d.active ? 'Live' : 'Sharing ended'}</span>
    <span><b>${esc(d.sharerName)}</b> is sharing a trip</span>
    <span class="muted">${esc(d.points[0].name)} → ${esc(d.points[d.points.length - 1].name)}</span>
    <span class="muted">Driver: ${esc(d.driverName)}${d.vehicle ? ' · ' + esc(d.vehicle) : ''}</span>
    <span class="muted" id="ago">${ago(d.updatedAt)}</span>
    <span class="sos"><a href="tel:112">📞 Emergency 112</a></span>`;
  ensureMap();
  if (!map) return;
  drawRoute(d.points);
  if (d.lat != null && d.lng != null) {
    const pos = [d.lat, d.lng];
    if (!marker) {
      marker = L.marker(pos, { icon: L.divIcon({ className: '', html: '<div class="me-pin"></div>', iconSize: [22, 22], iconAnchor: [11, 11] }), zIndexOffset: 1000 })
        .addTo(map).bindTooltip(esc(d.sharerName));
      ring = L.circle(pos, { radius: Math.min(d.accuracy || 30, 500), color: '#2563eb', weight: 1, fillOpacity: 0.08 }).addTo(map);
    } else {
      marker.setLatLng(pos);
      ring.setLatLng(pos).setRadius(Math.min(d.accuracy || 30, 500));
    }
    if (!fitted) { map.setView(pos, 14); fitted = true; }
  }
}

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
